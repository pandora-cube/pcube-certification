name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - certification.config.json
      - scripts/generate_certificates.py
      - scripts/templates/**
      - verify/*/data.json
      - verify/*/badge.svg
      - verify/*/badge.png
      - verify/*/template.html
      - verify/assets/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate certification pages
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for data_file in verify/*/data.json; do
            [ -f "$data_file" ] || continue
            found=true
            study_slug="$(basename "$(dirname "$data_file")")"
            python3 scripts/generate_certificates.py --study "$study_slug"
          done
          if [ "$found" = false ]; then
            echo "No study data.json files found." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy verify --project-name=pcube-certification --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
