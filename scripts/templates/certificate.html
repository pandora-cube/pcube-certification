<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="Pandoracube Team Vent Certificate Generator">
    <title>{{EARNER_NAME}}님의 {{STUDY_NAME}} {{CERTIFICATE_NAME}}</title>
    <meta property="og:title" content="{{EARNER_NAME}}님의 {{STUDY_NAME}} {{CERTIFICATE_NAME}}">
    <meta property="og:description" content="Pandoracube · Team Vent 공식 {{CERTIFICATE_NAME}}입니다. 발급번호: {{BADGE_ID}}">
    <meta property="og:image" content="{{OG_IMAGE_URL}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <script>document.documentElement.dataset.embed = String(new URLSearchParams(location.search).get("embed") === "1");</script>
    <style>
        :root {
            color-scheme: light;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            color: #1b1919;
            background: #faf8f7;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * { box-sizing: border-box; }
        body {
            position: relative;
            isolation: isolate;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background-color: #faf8f7;
            background-image: {{BACKGROUND_IMAGE_URL}};
            background-size: cover;
            background-position: center;
            -webkit-user-select: none;
            user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: url("{{CERTIFICATION_LOGO_URL}}") center / min(88vw, 860px) auto no-repeat;
            opacity: .055;
        }

        main {
            position: relative;
            width: min(100%, 440px);
            overflow: hidden;
            padding: 34px 30px 28px;
            border: 1px solid #eee7e5;
            border-radius: 20px;
            background: rgba(255, 255, 255, .98);
            box-shadow: 0 18px 48px rgba(45, 30, 30, .09);
            text-align: center;
        }

        .brand {
            margin: 0 0 24px;
            color: #c91d27;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: .13em;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin: 0 0 22px;
            padding: 7px 13px;
            border-radius: 99px;
            background: #fff0ef;
            color: #b51e27;
            font-size: 13px;
            font-weight: 700;
        }

        .status::before { content: "✓"; font-size: 15px; }
        body[data-certificate-type="operator"] .status { background: #eef4ff; color: #245aa5; }

        .badge {
            display: block;
            width: min(100%, 245px);
            height: auto;
            margin: 0 auto 25px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: -.035em;
            word-break: keep-all;
        }

        h1, .earner, dl, dl * {
            -webkit-user-select: text;
            user-select: text;
        }

        .earner { margin: 7px 0 28px; color: #716968; font-size: 15px; font-weight: 400; }
        dl { margin: 0; border-top: 1px solid #eee7e5; text-align: left; }
        dl div { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 14px 3px; border-bottom: 1px solid #eee7e5; font-size: 14px; }
        dt { color: #817775; font-weight: 400; }
        dd { margin: 0; color: #211d1c; font-weight: 600; overflow-wrap: anywhere; }

        footer {
            margin-top: 25px;
            color: #8b817f;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .09em;
        }

        img { -webkit-user-drag: none; user-select: none; }
        .stamp { position: absolute; right: 16px; bottom: 14px; width: 34px; height: 42px; object-fit: contain; opacity: 1; }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 24px;
        }

        .action {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 12px;
            border: 1px solid #ded7d5;
            border-radius: 10px;
            background: #fff;
            color: #332e2d;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            text-decoration: none;
            cursor: pointer;
        }

        .action:hover { border-color: #b9aeab; background: #faf8f7; }
        .action:focus-visible { outline: 3px solid rgba(10, 102, 194, .25); outline-offset: 2px; }
        .action.linkedin { border-color: #0a66c2; background: #0a66c2; color: #fff; }
        .action.linkedin:hover { background: #004182; }
        .action svg { width: 16px; height: 16px; flex: none; fill: currentColor; }
        .copy-status { min-height: 18px; margin: 7px 0 -8px; color: #716968; font-size: 11px; }
        .embed-verification { display: none; }

        html[data-embed="true"] body { min-height: 100vh; padding: 12px; background-image: none; }
        html[data-embed="true"] body::before { display: none; }
        html[data-embed="true"] main { width: min(100%, 380px); padding: 24px 24px 22px; box-shadow: 0 8px 28px rgba(45, 30, 30, .1); }
        html[data-embed="true"] .brand,
        html[data-embed="true"] .status,
        html[data-embed="true"] dl,
        html[data-embed="true"] footer,
        html[data-embed="true"] .stamp,
        html[data-embed="true"] .actions,
        html[data-embed="true"] .copy-status { display: none; }
        html[data-embed="true"] .badge { width: min(100%, 190px); margin-bottom: 18px; }
        html[data-embed="true"] h1 { font-size: 19px; }
        html[data-embed="true"] .earner { margin-bottom: 16px; }
        html[data-embed="true"] .embed-verification {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 14px;
            border-top: 1px solid #eee7e5;
            color: #716968;
            font-size: 11px;
        }
        .embed-verification a { color: #b51e27; font-weight: 700; text-decoration: none; }
        .embed-verification a:hover { text-decoration: underline; }

        @media (max-width: 360px) {
            main { padding-inline: 20px; }
            dl div { grid-template-columns: 76px 1fr; }
            .actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-credential-url="{{CANONICAL_URL}}" data-study-name="{{STUDY_NAME}}" data-earner-name="{{EARNER_NAME}}" data-certificate-name="{{CERTIFICATE_NAME}}" data-certificate-type="{{CERTIFICATE_TYPE}}">
    <main>
        <p class="brand">PANDORACUBE · TEAM VENT</p>
        <p class="status">{{CERTIFICATE_NAME}} 완료</p>
        <img class="badge" src="{{BADGE_IMAGE_URL}}" alt="Pandoracube 스터디 인증 배지" draggable="false">
        <h1>{{STUDY_NAME}}</h1>
        <p class="earner">{{EARNER_NAME}} · {{HOLDER_ROLE}}</p>
        <dl>
            <div><dt>발급 번호</dt><dd>{{BADGE_ID}}</dd></div>
            <div><dt>발급 일자</dt><dd>{{ISSUE_DATE}}</dd></div>
            <div><dt>인증 기관</dt><dd>Pandoracube · Team Vent</dd></div>
        </dl>
        <footer>VERIFIED BY PANDORACUBE · TEAM VENT</footer>
        <img class="stamp" src="{{STAMP_IMAGE_URL}}" alt="Pandoracube 인증 마크" draggable="false">
        <div class="actions" aria-label="인증 배지 공유">
            <a class="action linkedin" href="{{LINKEDIN_URL}}" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V8.98h3.42v1.57h.05c.47-.9 1.64-1.85 3.37-1.85 3.61 0 4.27 2.37 4.27 5.46v6.29ZM5.32 7.41a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12Zm1.78 13.04H3.54V8.98H7.1v11.47ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45C23.2 24 24 23.23 24 22.27V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
                LinkedIn에 등록
            </a>
            <button class="action" id="copy-embed" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>
                임베드 코드 복사
            </button>
        </div>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
        <div class="embed-verification">
            <span>{{BADGE_ID}}</span>
            <a href="{{CANONICAL_URL}}" target="_blank" rel="noopener noreferrer">인증 원본 보기</a>
        </div>
    </main>
    <script>
        (() => {
            const copyButton = document.getElementById("copy-embed");
            const copyStatus = document.getElementById("copy-status");
            const { credentialUrl, studyName, earnerName, certificateName } = document.body.dataset;

            const escapeAttribute = (value) => value
                .replaceAll("&", "&amp;")
                .replaceAll('"', "&quot;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");

            const embedUrl = new URL(credentialUrl);
            embedUrl.searchParams.set("embed", "1");
            const title = `${earnerName}님의 ${studyName} ${certificateName} 배지`;
            const embedCode = `<iframe src="${escapeAttribute(embedUrl.href)}" title="${escapeAttribute(title)}" width="420" height="520" loading="lazy" style="width:100%;max-width:420px;border:0" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;

            const fallbackCopy = (text) => {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                document.body.appendChild(textarea);
                textarea.select();
                const copied = document.execCommand("copy");
                textarea.remove();
                if (!copied) throw new Error("copy failed");
            };

            copyButton.addEventListener("click", async () => {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(embedCode);
                    } else {
                        fallbackCopy(embedCode);
                    }
                    copyStatus.textContent = "임베드 코드를 복사했습니다.";
                } catch {
                    copyStatus.textContent = "복사하지 못했습니다. 브라우저의 클립보드 권한을 확인해 주세요.";
                }
            });
        })();
    </script>
</body>
</html>
